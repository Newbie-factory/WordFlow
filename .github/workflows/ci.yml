name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Domain
            project: tests/WordFlow.Domain.Tests/WordFlow.Domain.Tests.csproj
          - name: Application
            project: tests/WordFlow.Application.Tests/WordFlow.Application.Tests.csproj
          - name: Infrastructure
            project: tests/WordFlow.Infrastructure.Tests/WordFlow.Infrastructure.Tests.csproj
          - name: App
            project: tests/WordFlow.App.Tests/WordFlow.App.Tests.csproj
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore WordFlow.sln
      - name: Test
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "${{ matrix.name }}.trx"
          dotnet test "${{ matrix.project }}" -c Release --no-restore --nologo `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=$resultPath"
          $testExitCode = $LASTEXITCODE

          if ($testExitCode -ne 0 -and (Test-Path -LiteralPath $resultPath)) {
            [xml]$results = Get-Content -LiteralPath $resultPath -Raw
            $results.TestRun.Results.UnitTestResult |
              Where-Object outcome -eq 'Failed' |
              ForEach-Object {
                $message = "{0}: {1}" -f $_.testName, $_.Output.ErrorInfo.Message
                $escaped = $message.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
                Write-Host "::error title=Failed test::$escaped"
              }
          }

          exit $testExitCode
